syntax = "proto3";

package avp;

// --- Enums ---

enum PayloadType {
  HIDDEN_STATE = 0;
  KV_CACHE = 1;
}

enum CommunicationMode {
  LATENT = 0;
  JSON_MODE = 1;  // "JSON" is reserved in some protobuf implementations
}

enum DataType {
  FLOAT32 = 0;
  FLOAT16 = 1;
  BFLOAT16 = 2;
  INT8 = 3;
}

// Cross-model projection method used when avp_map_id is non-empty.
enum ProjectionMethod {
  VOCAB_MEDIATED = 0;  // Vocabulary-mediated projection, shared tokenizer (zero learned parameters)
  VOCAB_OVERLAP = 1;   // Vocabulary-overlap projection, different tokenizers (zero learned parameters)
}

// --- Metadata ---

// Metadata embedded in every AVP message, serialized via Protocol Buffers.
message Metadata {
  // Identity
  string session_id = 1;
  string source_agent_id = 2;
  string target_agent_id = 3;
  string model_id = 4;

  // Model structure
  uint32 hidden_dim = 5;
  uint32 num_layers = 6;

  // Payload info
  PayloadType payload_type = 7;
  DataType dtype = 8;
  repeated uint32 tensor_shape = 9;

  // Communication
  CommunicationMode mode = 10;
  optional string compression = 11;
  // Cross-model projection map identifier.
  // Format: "vocab:{tokenizer_hash[:16]}" for vocabulary-mediated,
  //         "vocab_overlap:{overlap_count}" for vocabulary-overlap,
  //         "{src_hash[:16]}_{tgt_hash[:16]}" for pre-calibrated maps.
  // Empty for same-model communication.
  string avp_map_id = 13;

  // Extensible
  map<string, string> extra = 14;

  // Integrity
  optional uint32 payload_checksum = 15;  // CRC32 of pre-compression payload bytes
}

// --- Responses ---

// Response returned by AVP endpoints.
message TransmitResponse {
  bool success = 1;
  optional string message = 2;
  optional string request_id = 3;
  map<string, string> extra = 4;
}
